<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" fill-opacity="0.4"/>
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="70%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Badge Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1.5deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -120; }
    }
    @keyframes nodePing {
      0% { r: 3px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; }
    .floating-pill-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
    .flow-line {
      stroke-dasharray: 8 10;
      animation: dashMove 5s linear infinite;
    }
    .ping-circle {
      animation: nodePing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- 1. Background Layer -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#glowPurple)"/>
  <rect width="1200" height="340" fill="url(#glowCyan)"/>
  <rect width="1200" height="340" fill="url(#glowRose)"/>
  <rect width="1200" height="340" fill="url(#techGrid)"/>

  <!-- 2. Animated State Graph / Flow Lines (Background Layer) -->
  <g opacity="0.45">
    <!-- State Flow Curves -->
    <path class="flow-line" d="M 60 70 C 220 30, 320 120, 480 60" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path class="flow-line" d="M 720 280 C 860 320, 980 230, 1140 270" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <path class="flow-line" d="M 100 280 C 280 220, 360 310, 520 260" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <path class="flow-line" d="M 700 70 C 850 40, 960 130, 1120 70" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- State Transition Nodes with Ping Animation -->
    <g transform="translate(480, 60)">
      <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#6366f1" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#6366f1"/>
    </g>
    <g transform="translate(720, 280)">
      <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#06b6d4"/>
    </g>
    <g transform="translate(1120, 70)">
      <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#a855f7"/>
    </g>
    <g transform="translate(100, 280)">
      <circle class="ping-circle" cx="0" cy="0" r="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#3b82f6"/>
    </g>
  </g>

  <!-- 3. Dynamic Ambient Floating Tech Cards (Positioned at corners/sides to avoid center text) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(80, 48)">
    <rect width="128" height="34" rx="17" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#764abc"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c7d2fe">⚡ Redux Toolkit</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(970, 52)">
    <rect width="112" height="34" rx="17" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#06b6d4"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a5f3fc">🐻 Zustand</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-2" transform="translate(70, 248)">
    <rect width="118" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#a855f7"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e9d5ff">👻 Jotai / Recoil</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-1" transform="translate(980, 244)">
    <rect width="124" height="34" rx="17" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a7f3d0">🍍 Pinia / Vuex</text>
  </g>

  <!-- Side Left Mid Pill -->
  <g class="floating-pill-1" transform="translate(35, 148)" opacity="0.75">
    <rect width="102" height="30" rx="15" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#fde68a">⚙️ XState (FSM)</text>
  </g>

  <!-- Side Right Mid Pill -->
  <g class="floating-pill-2" transform="translate(1045, 150)" opacity="0.75">
    <rect width="110" height="30" rx="15" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#fbcfe8">📡 TanStack / SWR</text>
  </g>

  <!-- 4. FOREGROUND LAYER (Guaranteed High Contrast & Never Obscured) -->
  <g id="foreground" text-anchor="middle" transform="translate(600, 0)">
    
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 58)">
      <rect x="-190" y="0" width="380" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
      <text y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.8">
        ✨ CURATED STATE MANAGEMENT ECOSYSTEM ✨
      </text>
    </g>

    <!-- Main Title -->
    <text y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
      Awesome State Management
    </text>

    <!-- Subtitle -->
    <text y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Predictable State Architectures • Fine-Grained Reactivity • Telemetry &amp; DevTools
    </text>

    <!-- Framework & Paradigm Badges Row -->
    <g transform="translate(0, 240)">
      <!-- React -->
      <g transform="translate(-235, 0)">
        <rect x="-38" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">⚛️ React</text>
      </g>
      <!-- Vue -->
      <g transform="translate(-140, 0)">
        <rect x="-34" y="0" width="68" height="26" rx="6" fill="#1e293b" stroke="#42b883" stroke-width="1"/>
        <text y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#42b883">🟢 Vue</text>
      </g>
      <!-- Angular -->
      <g transform="translate(-45, 0)">
        <rect x="-42" y="0" width="84" height="26" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
        <text y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f87171">🅰️ Angular</text>
      </g>
      <!-- Signals -->
      <g transform="translate(55, 0)">
        <rect x="-40" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
        <text y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#facc15">📶 Signals</text>
      </g>
      <!-- Micro-State -->
      <g transform="translate(160, 0)">
        <rect x="-48" y="0" width="96" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
        <text y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c084fc">🔬 Atomic</text>
      </g>
      <!-- Observability -->
      <g transform="translate(265, 0)">
        <rect x="-42" y="0" width="84" height="26" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
        <text y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#fb7185">🔭 Telemetry</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <path d="M -300 295 L 300 295" stroke="url(#titleGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
</svg>
